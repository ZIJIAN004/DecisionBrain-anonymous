<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecisionBrain</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --surface-soft: #f9fafb;
            --border: #d8dee8;
            --border-soft: #e8edf4;
            --text: #172033;
            --muted: #657189;
            --blue: #2563eb;
            --blue-soft: #e8f0ff;
            --green: #16875d;
            --green-soft: #e7f7ef;
            --amber: #a15c00;
            --amber-soft: #fff3d9;
            --red: #c93636;
            --red-soft: #fde9e9;
            --cyan: #087f9f;
            --shadow: 0 10px 30px rgba(23, 32, 51, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }

        button,
        textarea,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        button:disabled,
        textarea:disabled {
            cursor: not-allowed;
            opacity: 0.58;
        }

        .app {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100%;
            min-height: 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 18px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 0 rgba(23, 32, 51, 0.02);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: #172033;
            color: #fff;
            font-weight: 800;
            flex: 0 0 auto;
        }

        .brand-title {
            font-size: 18px;
            line-height: 1.2;
            font-weight: 760;
            white-space: nowrap;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .icon-button,
        .text-button,
        .primary-button,
        .danger-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            transition: border-color 0.16s ease, background-color 0.16s ease, color 0.16s ease,
                transform 0.12s ease;
        }

        .icon-button {
            width: 36px;
            font-size: 18px;
        }

        .text-button,
        .primary-button,
        .danger-button {
            gap: 6px;
            padding: 0 12px;
            font-weight: 650;
            white-space: nowrap;
        }

        .primary-button {
            border-color: var(--blue);
            background: var(--blue);
            color: #fff;
        }

        .danger-button {
            border-color: #efb4b4;
            color: var(--red);
        }

        .icon-button:hover,
        .text-button:hover {
            border-color: #9aa8bd;
            background: var(--surface-soft);
        }

        .primary-button:hover {
            background: #1e55ca;
        }

        .danger-button:hover {
            background: var(--red-soft);
        }

        .benchmark-dialog {
            width: min(680px, calc(100vw - 32px));
            max-height: calc(100vh - 48px);
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 24px 70px rgba(23, 32, 51, 0.22);
        }

        .benchmark-dialog::backdrop {
            background: rgba(23, 32, 51, 0.38);
        }

        .benchmark-dialog-body {
            display: grid;
            gap: 16px;
            padding: 20px;
        }

        .benchmark-dialog-head,
        .benchmark-actions,
        .benchmark-progress-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .benchmark-dialog-head h2 {
            margin: 0;
            font-size: 18px;
        }

        .benchmark-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(180px, 0.7fr);
            gap: 12px;
        }

        .benchmark-field {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
        }

        .benchmark-field select {
            width: 100%;
            min-height: 40px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
        }

        .benchmark-note,
        .benchmark-progress {
            padding: 12px;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: var(--surface-soft);
        }

        .benchmark-note {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .benchmark-progress-log {
            display: grid;
            gap: 6px;
            margin-top: 10px;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12px;
        }

        .benchmark-result-runs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .shell {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 16px;
            height: 100%;
            min-height: 0;
            padding: 16px;
        }

        .runs-pane,
        .workspace {
            min-height: 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .runs-pane {
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }

        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid var(--border-soft);
        }

        .pane-title {
            font-size: 14px;
            font-weight: 760;
            color: #344056;
        }

        .run-list {
            min-height: 0;
            overflow: auto;
            padding: 8px;
        }

        .run-row {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            text-align: left;
            color: var(--text);
        }

        .run-row:hover {
            background: var(--surface-soft);
        }

        .run-row.active {
            border-color: #9bb8f5;
            background: var(--blue-soft);
        }

        .run-row-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 690;
            line-height: 1.35;
        }

        .run-row-meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 64px;
            height: 24px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-created,
        .status-running {
            color: var(--blue);
            background: var(--blue-soft);
        }

        .status-needs_clarification {
            color: var(--amber);
            background: var(--amber-soft);
        }

        .status-succeeded {
            color: var(--green);
            background: var(--green-soft);
        }

        .status-failed,
        .status-cancelled {
            color: var(--red);
            background: var(--red-soft);
        }

        .status-draft {
            color: var(--muted);
            background: var(--surface-soft);
        }

        .workspace {
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
        }

        .run-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-soft);
        }

        .run-title-wrap {
            min-width: 0;
        }

        .run-title {
            margin: 0;
            font-size: 20px;
            line-height: 1.25;
            font-weight: 780;
            overflow-wrap: anywhere;
        }

        .run-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .run-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .content-scroll {
            min-height: 0;
            overflow: auto;
            padding: 0 18px 18px;
        }

        .section {
            padding: 18px 0;
            border-bottom: 1px solid var(--border-soft);
        }

        .section:last-child {
            border-bottom: 0;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .section-title {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
            font-weight: 780;
            color: #344056;
        }

        .empty-state {
            display: grid;
            align-content: center;
            gap: 8px;
            min-height: 180px;
            color: var(--muted);
            text-align: center;
        }

        .empty-state strong {
            color: var(--text);
            font-size: 16px;
        }

        .summary-band {
            display: grid;
            gap: 12px;
        }

        .summary-main {
            border-left: 4px solid var(--blue);
            padding: 12px 14px;
            border-radius: 8px;
            background: var(--surface-soft);
        }

        .summary-main p {
            margin: 0;
            line-height: 1.72;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .metric {
            min-width: 0;
            padding: 10px;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: #fff;
        }

        .metric-label {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.3;
        }

        .metric-value {
            margin-top: 5px;
            font-weight: 760;
            overflow-wrap: anywhere;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 14px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
        }

        .data-table caption {
            margin-bottom: 8px;
            color: #344056;
            font-weight: 760;
            text-align: left;
        }

        .data-table th,
        .data-table td {
            border: 1px solid var(--border-soft);
            padding: 8px;
            text-align: left;
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        .data-table th {
            width: 46%;
            background: var(--surface-soft);
            color: #344056;
            font-weight: 700;
        }

        .details-list {
            display: grid;
            gap: 8px;
            margin-top: 14px;
        }

        details.result-detail {
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: #fff;
        }

        details.result-detail summary {
            padding: 10px 12px;
            color: #344056;
            font-weight: 740;
            cursor: pointer;
        }

        .detail-body {
            padding: 0 12px 12px;
            color: #273348;
            line-height: 1.72;
        }

        .detail-body p,
        .markdown p {
            margin: 0 0 10px;
        }

        .detail-body ul,
        .markdown ul {
            margin: 0 0 10px 20px;
            padding: 0;
        }

        .detail-body code,
        .markdown code {
            padding: 1px 4px;
            border-radius: 4px;
            background: #eef2f7;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.92em;
        }

        .stage-flow-scroll {
            overflow-x: auto;
            padding: 2px 2px 8px;
        }

        .stage-flow {
            min-width: 900px;
        }

        .stage-strip {
            display: grid;
            grid-template-columns: repeat(5, 24px minmax(112px, 1fr)) 24px minmax(112px, 1fr);
            align-items: stretch;
            gap: 0;
        }

        .stage-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9aa8bd;
            font-size: 18px;
            font-weight: 800;
        }

        .stage-item {
            min-width: 0;
            padding: 10px;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: #fff;
        }

        .stage-item.done {
            border-color: #b8e4cc;
            background: var(--green-soft);
        }

        .stage-item.active {
            border-color: #9bb8f5;
            background: var(--blue-soft);
        }

        .stage-item.failed {
            border-color: #efb4b4;
            background: var(--red-soft);
        }

        .stage-item.skipped {
            border-style: dashed;
            background: var(--surface-soft);
            color: var(--muted);
        }

        .stage-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 6px;
            border-radius: 50%;
            background: #eef2f7;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
        }

        .stage-item.done .stage-index {
            background: #c8ecd8;
            color: var(--green);
        }

        .stage-item.active .stage-index {
            background: #cbdafd;
            color: var(--blue);
        }

        .stage-item.failed .stage-index {
            background: #f5caca;
            color: var(--red);
        }

        .stage-name {
            font-size: 13px;
            font-weight: 750;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stage-round {
            margin-left: 6px;
            padding: 1px 5px;
            border-radius: 6px;
            background: var(--chip-bg, rgba(127, 127, 127, 0.18));
            font-size: 11px;
            font-weight: 600;
        }

        .stage-note {
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .review-feedback-flow {
            display: grid;
            grid-template-columns: repeat(5, 24px minmax(112px, 1fr)) 24px minmax(112px, 1fr);
            margin-top: 10px;
        }

        .review-feedback-card {
            grid-column: 5 / 10;
            position: relative;
            padding: 12px 14px;
            border: 1px dashed #d9ad62;
            border-radius: 10px;
            background: var(--amber-soft);
        }

        .review-feedback-card::before {
            content: "↓ reviewer feedback";
            position: absolute;
            top: -20px;
            right: 10px;
            color: var(--amber);
            font-size: 11px;
            font-weight: 750;
        }

        .review-feedback-card.accepted {
            border-color: #8cc9aa;
            background: var(--green-soft);
        }

        .review-feedback-card.idle {
            border-color: var(--border);
            background: var(--surface-soft);
        }

        .review-feedback-head,
        .review-feedback-targets {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .review-feedback-title {
            font-size: 13px;
            font-weight: 800;
        }

        .review-feedback-summary {
            margin-top: 6px;
            color: var(--text);
            font-size: 12px;
            line-height: 1.55;
        }

        .review-feedback-targets {
            justify-content: flex-start;
            margin-top: 8px;
        }

        .review-route-chip {
            padding: 3px 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--amber);
            font-size: 11px;
            font-weight: 750;
        }

        .review-feedback-card.accepted .review-route-chip {
            color: var(--green);
        }

        .review-history {
            display: grid;
            gap: 4px;
            margin-top: 8px;
            color: var(--muted);
            font-size: 11px;
        }

        .activity-list {
            display: grid;
            gap: 8px;
            margin-top: 14px;
        }

        .activity-item {
            display: grid;
            grid-template-columns: 84px minmax(0, 1fr);
            gap: 10px;
            padding: 10px;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: #fff;
        }

        .activity-time {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .activity-body {
            min-width: 0;
            line-height: 1.55;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .activity-body strong {
            color: #344056;
        }

        .activity-body.error {
            color: var(--red);
        }

        .activity-body.warning {
            color: var(--amber);
        }

        .clarification {
            display: grid;
            gap: 12px;
            padding: 14px;
            border: 1px solid #f0cf8d;
            border-radius: 8px;
            background: var(--amber-soft);
        }

        .question {
            display: grid;
            gap: 8px;
        }

        .question-title {
            font-weight: 720;
            line-height: 1.55;
        }

        .option-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .option-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 9px;
            border: 1px solid #e8bd69;
            border-radius: 8px;
            background: #fffaf0;
            font-size: 13px;
        }

        .answer-input,
        .composer-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            outline: none;
            resize: vertical;
        }

        .answer-input:focus,
        .composer-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .answer-input {
            min-height: 42px;
            padding: 9px 10px;
        }

        .artifact-list {
            display: grid;
            gap: 8px;
        }

        .artifact-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: #fff;
        }

        .artifact-name {
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .artifact-meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .download-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 32px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--blue);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .download-link:hover {
            background: var(--blue-soft);
        }

        .composer {
            display: grid;
            gap: 8px;
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            background: #fff;
        }

        .attachment-bar {
            display: none;
            flex-wrap: wrap;
            gap: 6px;
        }

        .attachment-bar.visible {
            display: flex;
        }

        .attachment-chip {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            gap: 6px;
            padding: 5px 8px;
            border-radius: 8px;
            background: var(--surface-soft);
            border: 1px solid var(--border-soft);
            color: #344056;
            font-size: 12px;
        }

        .attachment-chip span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 260px;
        }

        .attachment-chip button {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: transparent;
            color: var(--muted);
            font-size: 15px;
            line-height: 1;
        }

        .composer-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 8px;
            align-items: end;
        }

        .composer-input {
            min-height: 44px;
            max-height: 130px;
            padding: 11px 12px;
            line-height: 1.45;
        }

        .file-input {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
            }

            .app {
                min-height: 100%;
                height: auto;
            }

            .shell {
                grid-template-columns: 1fr;
                height: auto;
                min-height: calc(100vh - 58px);
            }

            .runs-pane {
                max-height: 260px;
            }

            .workspace {
                min-height: 680px;
            }

            .metric-grid,
            .data-grid,
            .benchmark-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .topbar,
            .run-header,
            .composer {
                padding-left: 12px;
                padding-right: 12px;
            }

                feasible: '可行', direct_contract: '直接契约', feasibility_rate: '可行率', median_gap: 'Gap 中位数',
                view_run: '查看 Run', enabled: '开启', disabled: '关闭', unsupported_file: '不支持的文件类型：',
