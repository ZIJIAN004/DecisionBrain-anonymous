[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionbrain"
dynamic = ["version"]
description = "Decision Brain operations-research agent development toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "httpx>=0.26.0,<1.0.0",
    "ijson>=3.5.0,<4.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "rich>=13.7.0,<15.0.0",
    "typer>=0.12.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
solver = [
    "alns>=7.0.0,<8.0.0",
    "gurobipy>=13.0.0,<14.0.0",
    "job-shop-lib>=1.7.0,<1.8.0",
    "pyjobshop>=0.0.9,<0.1.0",
    "pyscipopt>=6.2.1,<6.3.0",
    "pyvrp>=0.13.4",
    "ortools>=9.12.4544,<9.13.0",
    "rsome>=1.3.1,<1.4.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
dbn = "decisionbrain.cli.app:main"

[tool.setuptools.dynamic]
version = {attr = "decisionbrain.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["decisionbrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not solver and not network'"
timeout = 30
markers = [
    "unit: isolated, offline tests with deterministic fakes",
    "integration: offline tests spanning multiple DecisionBrain components",
    "solver: tests requiring an installed external solver or solver license",
    "network: tests requiring access to an external network service",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["benchmarks/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
